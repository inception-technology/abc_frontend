<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Paiement annulé — ART BEYOND CONVENIENCE</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  /* Aligné sur la refonte : thème sombre, Bricolage Grotesque + Space Grotesk +
     Space Mono, polices AUTO-HÉBERGÉES (RGPD, aucune Google Font). */
  @font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/bricolage-grotesque-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/space-grotesk-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Space Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/space-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Space Mono'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/space-mono-latin-700-normal.woff2') format('woff2'); }
  :root { --ink:#100E0C; --panel:#1A1613; --bone:#ECE6DA; --muted:#9A9184; --line:rgba(236,230,218,0.13); --accent:#EE5A2E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--ink); color: var(--bone);
    font-family: 'Space Grotesk', sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 24px; min-height: 100vh;
  }
  .card { max-width: 480px; width: 100%; text-align: center; }
  .brand { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .mark {
    width: 68px; height: 68px; margin: 28px auto 22px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); display: grid; place-items: center; font-size: 32px;
    animation: pop 0.4s cubic-bezier(0.22,0.61,0.36,1) both;
  }
  @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(26px, 6vw, 40px); margin: 0 0 12px; line-height: 1.02; letter-spacing: -0.02em; }
  p { font-size: 14px; line-height: 1.75; color: color-mix(in srgb, var(--bone) 85%, transparent); margin: 0 auto; max-width: 40ch; }
  .actions { margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; text-decoration: none; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase; padding: 14px 24px;
    background: var(--accent); color: var(--ink);
  }
  .btn.ghost { background: transparent; color: var(--bone); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn:hover { background: #ff6a3d; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">ART BEYOND CONVENIENCE</div>
    <div class="mark">×</div>
    <h1 id="title">Paiement annulé</h1>
    <p id="msg">Aucun montant n'a été débité. Votre panier est conservé — vous pouvez réessayer quand vous le souhaitez.</p>
    <div class="actions">
      <a class="btn" id="retry" href="/">Reprendre mes achats</a>
    </div>
  </div>
<script>
  (function () {
    var lang = "fr";
    try { var l = localStorage.getItem("abc_lang"); if (l === "en" || l === "fr") lang = l; } catch (e) {}
    var T = {
      fr: { title: "Paiement annulé", msg: "Aucun montant n'a été débité. Votre panier est conservé — vous pouvez réessayer quand vous le souhaitez.", retry: "Reprendre mes achats" },
      en: { title: "Payment canceled", msg: "No amount was charged. Your cart is kept — you can try again whenever you like.", retry: "Back to shopping" }
    };
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title + " — ART BEYOND CONVENIENCE";
    document.getElementById("title").textContent = t.title;
    document.getElementById("msg").textContent = t.msg;
    var retry = document.getElementById("retry");
    retry.textContent = t.retry;
    // Retour en REPLACE : cette page d'annulation ne reste pas dans l'historique,
    // pour ne pas y revenir (ni vers la page Stripe expirée) via « Précédent ».
    retry.addEventListener("click", function (e) { e.preventDefault(); location.replace("/"); });
  })();
</script>
</body>
</html>
